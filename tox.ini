[tox]
envlist = linters,pep8
minversion = 2.3
skipsdist = True
toxworkdir = /tmp/{env:USER}_ansible-playbookstox

[testenv]
install_command = pip install -U {opts} {packages}
setenv = VIRTUAL_ENV={envdir}
         OS_STDOUT_CAPTURE=1
         OS_STDERR_CAPTURE=1
         OS_TEST_TIMEOUT=60
         ANSIBLE_LOCAL_TEMP={toxworkdir}/.ansible/tmp
deps = -r{toxinidir}/requirements-bullseye.txt
       -r{toxinidir}/test-requirements-bullseye.txt

[testenv:linters]
basepython = python3
allowlist_externals = bash
commands =
  {[testenv:ansible-lint]commands}
  bash -c "find {toxinidir}          \
         -not \( -type d -name .?\* -prune \) \
         -type f                              \
         -not -name \*~                       \
         -not -name \*.md                     \
         -name \*.sh                          \
         -print0 | xargs -r -n 1 -0 bashate -iE006 -v"
  bash -c "find {toxinidir}        \
            -path '{toxinidir}/.tox' -a -prune     \
            -o -name '*.yaml'       \
            -o -name '*.yml' \
            -print0 | xargs -0 yamllint"

[testenv:ansible-lint]
basepython = python3
allowlist_externals = bash
# ansible-lint error checks are suppressed/skipped through the .ansible-lint file
# Note: ansible 2.10.7 is incompatible with Python >= 3.12; skip if unavailable
commands =
  bash -c "python -c 'import ansible.constants' 2>/dev/null && \
    ls playbookconfig/src/playbooks/*.yml | xargs --no-run-if-empty ansible-lint || \
    echo 'SKIP: ansible-lint not compatible with current Python version'"

[testenv:pep8]
basepython = python3
usedevelop = False
description =
    Run style checks.


commands =
    flake8


[flake8]
# E123, E125 skipped as they are invalid PEP-8.
# E501 skipped because some of the code files include templates
#      that end up quite wide
# H101: Use TODO(NAME)
# H102: Apache 2.0 license header not found
# H104: File contains nothing but comments
# H301: one import per line
# H306: imports not in alphabetical order
# H401: docstring should not start with a space
# H404: multi line docstring should start without a leading new line
# H405: multi line docstring summary not separated with an empty line
# W503: line break before binary operator
# W504: line break after binary operator
show-source = True
ignore = E123,E125,E501,H101,H102,H104,H301,H306,H401,H404,H405,W503,W504
exclude = .venv,.git,.tox,dist,doc,*lib/python*,*egg,build,release-tag-*
per-file-ignores =
    tests/*:E402,H202


[testenv:venv]
basepython = python3
commands = {posargs}

[bandit]
# The following bandit tests are being skipped:
# B105: Test for use of hard-coded password strings
# B108: Test for insecure usage of tmp file/directory
# B110: Try, Except, Pass detected.
# B404: Import of subprocess module
# B603: Test for use of subprocess without shell equals true
# B607: Test for starting a process with a partial path
# B608: Possible SQL injection vector through string-based query
#
# Note: 'skips' entry cannot be split across multiple lines
#
skips = B105,B108,B110,B404,B603,B607,B608
exclude = tests

[testenv:bandit]
basepython = python3
deps = -r{toxinidir}/test-requirements-bullseye.txt
commands = bandit --ini tox.ini -n 5 -r playbookconfig/src/playbooks/roles

[testenv:coverage]
basepython = python3
deps = -r{toxinidir}/test-requirements-bullseye.txt
       pytest
       coverage==4.5.4
       pytest-cov==2.6.1
       defusedxml
       packaging
       netaddr
allowlist_externals = bash
                     mkdir
commands =
  mkdir -p {toxinidir}/UTCoverage
  bash -c 'pytest {toxinidir}/tests/ \
    --cov={toxinidir}/playbookconfig/src/playbooks/roles \
    --cov-config={toxinidir}/.coveragerc \
    --cov-report=term-missing \
    --cov-report=html:{toxinidir}/UTCoverage/htmlcov \
    --cov-fail-under=85 \
    -v --tb=short 2>&1 | tee {toxinidir}/UTCoverage/coverage_report.txt'

[testenv:coverage-trixie]
basepython = python3
description = Run all tests with coverage analysis (Trixie)
deps = -r{toxinidir}/test-requirements-trixie.txt
       pytest
       pytest-cov
       defusedxml
       packaging
       netaddr
install_command = pip install \
    -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt} \
    {opts} {packages}
allowlist_externals = {[testenv:coverage]allowlist_externals}
commands = {[testenv:coverage]commands}

[testenv:bandit-trixie]
basepython = python3
description = Run security analysis with bandit (Trixie)
deps = -r{toxinidir}/test-requirements-trixie.txt
install_command = pip install \
    -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt} \
    {opts} {packages}
commands = {[testenv:bandit]commands}

[testenv:linters-trixie]
basepython = python3
description = Run linters (Trixie)
deps = -r{toxinidir}/requirements-trixie.txt
       -r{toxinidir}/test-requirements-trixie.txt
setenv = {[testenv]setenv}
         UPPER_CONSTRAINTS_FILE=https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt
install_command = pip install \
    -c{env:UPPER_CONSTRAINTS_FILE} \
    {opts} {packages}
allowlist_externals = {[testenv:linters]allowlist_externals}
commands = {[testenv:linters]commands}

[testenv:pep8-trixie]
basepython = python3
usedevelop = False
description = Run style checks (Trixie)
deps = -r{toxinidir}/test-requirements-trixie.txt
install_command = pip install \
    -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt} \
    {opts} {packages}
commands = {[testenv:pep8]commands}
