#
#   This role persists the OAM interface of controller-0 in the sysinv
#   database, so that a reboot brings the OAM network up on the deployed
#   interface instead of the factory one.
#
#   The host must be locked: sysinv rejects recreating the OAM interface
#   (VLAN or bond) on an unlocked host.
#

- name: Update OAM interface
  script: >
    update_oam_interface.py {{ bootstrap_interface }}
    {% if bootstrap_vlan is defined and bootstrap_vlan != '' %}
    {{ bootstrap_vlan }}
    {% endif %}
  register: update_result
  failed_when: false

- name: Handle update failure
  fail:
    msg: |
      Failed to update OAM interface. The host would lose OAM connectivity
      after the next reboot. Please manually update the OAM interface,
      finish the software update, and retry the operation.
      Error output:
      {{ update_result.stdout }}
      {{ update_result.stderr }}
  when: update_result.rc != 0
