# ROLE DESCRIPTION:
#   This role is to perform connectivity check on the target
#   hosts.
#
# Check host connectivity
- block:
    - name: Set SSH port
      set_fact:
        ansible_port: "{{ ansible_port | default(22) }}"

    - name: Format the ansible host if it is an IP address (Bullseye)
      set_fact:
        ansible_host: "{{ ansible_host | ipaddr }}"
      when:
        - is_bullseye | default(false)
        - ansible_host | ipaddr

    - name: Format the ansible host if it is an IP address (Trixie)
      set_fact:
        ansible_host: "{{ ansible_host | ansible.utils.ipaddr }}"
      when:
        - is_trixie | default(false)
        - ansible_host | ansible.utils.ipaddr

    - name: Check connectivity
      wait_for:
        port: "{{ ansible_port }}"
        host: "{{ ansible_host }}"
        timeout: 10
        state: started
      delegate_to: localhost

    - name: Gather remote SSH public key
      command: >
        ssh-keyscan -T 20 -p {{ ansible_port if ansible_port else 22 }} {{ ansible_host }}
      register: remote_keyscan
      until: remote_keyscan.stdout != ""
      retries: 6
      delay: "{{ 3 | random }}"
      delegate_to: localhost

    - name: Print warning if ssh-keyscan command is timed out
      debug:
        msg: "ssh-keyscan command is timed out."
      when: remote_keyscan.stdout == ""

    - name: Add remote SSH public keys into the known_hosts
      known_hosts:
        path: "~/.ssh/known_hosts"
        name: "{{ item.split() | first }}"
        key: "{{ item }}"
        state: present
      loop: "{{ remote_keyscan.stdout_lines | reject('match', '^#') | list }}"
      register: add_sshkey
      until: not add_sshkey.changed
      retries: 6
      delay: "{{ 3 | random }}"
      delegate_to: localhost
