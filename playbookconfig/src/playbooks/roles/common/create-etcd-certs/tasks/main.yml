# ROLE DESCRIPTION:
#   Create etcd server and client certs and key.

- name: Generate private key for etcd server and client
  openssl_privatekey:
    path: "/etc/etcd/{{ item }}.key"
    type: RSA
    size: 4096
    state: present
    force: true
  loop:
    - "etcd-server"
    - "apiserver-etcd-client"
    - "etcd-client"
    - "etcd-fixed-0"

# Per-member server certificates.
#
# Each etcd member is issued its own key pair whose SAN covers only the address
# that member binds, so a certificate identifies exactly one member rather than
# standing in for the whole cluster. The common name carries the etcd member
# name. etcd is not configured to enforce it: peer-cert-allowed-cn is unset, so
# ETCD_PEER_CLIENT_CERT_AUTH accepts any certificate signed by the CA. What the
# split gives today is a key per member and a SAN that names one address.
#
# controller-1's key pair is deliberately absent here. It is generated on
# controller-1 itself at unlock, by platform::etcd::membership in stx-puppet,
# so the private key never crosses a host boundary.
- name: Generate CSR for the floating etcd member
  openssl_csr:
    path: "/etc/etcd/etcd-server.csr"
    privatekey_path: "/etc/etcd/etcd-server.key"
    common_name: "controller"
    key_usage:
      - digitalSignature
      - keyEncipherment
    extended_key_usage:
      - serverAuth
      - clientAuth
    subject_alt_name: >-
      {{ ['IP:' + cluster_floating_address,
          'IP:127.0.0.1', 'IP:::1'] | unique }}
    force: true

- name: Generate CSR for the controller-0 fixed etcd member
  openssl_csr:
    path: "/etc/etcd/etcd-fixed-0.csr"
    privatekey_path: "/etc/etcd/etcd-fixed-0.key"
    common_name: "fixed-0"
    key_usage:
      - digitalSignature
      - keyEncipherment
    extended_key_usage:
      - serverAuth
      - clientAuth
    subject_alt_name: >-
      {{ ['IP:' + controller_0_cluster_host,
          'IP:127.0.0.1', 'IP:::1'] | unique }}
    force: true

# The apiserver connects to every etcd endpoint, so its client certificate keeps
# the full address set. SANs on a client certificate are not used to authorise
# it -- the server matches on CN and extended key usage -- but they are retained
# here to avoid changing apiserver behaviour in the same change.
- name: Generate CSR for the apiserver etcd client
  openssl_csr:
    path: "/etc/etcd/apiserver-etcd-client.csr"
    privatekey_path: "/etc/etcd/apiserver-etcd-client.key"
    common_name: "apiserver-etcd-client"
    key_usage:
      - digitalSignature
      - keyEncipherment
    extended_key_usage:
      - serverAuth
      - clientAuth
    subject_alt_name: >-
      {{ (['IP:' + cluster_floating_address,
           'IP:' + controller_0_cluster_host]
          + (['IP:' + controller_1_cluster_host]
             if system_mode != 'simplex' else [])
          + ['IP:127.0.0.1', 'IP:::1']) | unique }}
    force: true

- name: Generate CSRs for etcd root client
  openssl_csr:
    path: "/etc/etcd/{{ item }}.csr"
    privatekey_path: "/etc/etcd/{{ item }}.key"
    common_name: "root"
    key_usage:
      - digitalSignature
    extended_key_usage:
      - serverAuth
      - clientAuth
    force: true
  loop:
    - "etcd-client"

- name: Define values for etcd certificate and key
  set_fact:
    etcd_root_ca_cert: "{{ etcd_root_ca_cert | default('') }}"
    etcd_root_ca_key: "{{ etcd_root_ca_key | default('') }}"

- name: Setup dictionary of etcd certificates to install
  set_fact:
    etcd_ca_files: { ca.crt: "{{etcd_root_ca_cert}}", ca.key: "{{etcd_root_ca_key}}" }
  when:
    - etcd_root_ca_cert | default('', true) | length > 0
    - etcd_root_ca_key | default('', true) | length > 0

- name: Copy etcd root ca certificates
  copy:
    src: "{{ item.value }}"
    dest: "/etc/etcd/{{item.key}}"
    remote_src: yes
  with_dict: "{{ etcd_ca_files }}"
  when: etcd_ca_files is defined

- block:
  - name: Generate private key for etcd-ca
    openssl_privatekey:
      path: "/etc/etcd/ca.key"
      type: RSA
      size: 4096
      state: present
      force: true

  - name: Generate CSR for etcd-ca
    openssl_csr:
      path: "/etc/etcd/ca.csr"
      privatekey_path: "/etc/etcd/ca.key"
      common_name: etcd
      basic_constraints:
        - CA:TRUE
        - pathlen:1
      basic_constraints_critical: true
      key_usage:
        - keyCertSign
        - digitalSignature
        - keyEncipherment
      force: true

  - name: Generate self-signed CA certificate for etcd-ca
    openssl_certificate:
      path: "/etc/etcd/ca.crt"
      privatekey_path: "/etc/etcd/ca.key"
      csr_path: "/etc/etcd/ca.csr"
      provider: selfsigned
      force: true
  when: etcd_root_ca_cert == ''

- name: Get date 1 year from now in ASN.1 TIME format (YYYYMMDDHHMMSSZ)
  command: "date -u -d 'next year' +'%Y%m%d%H%M%SZ'"
  register: next_year_date

- name: Generate certs signed with etcd CA certificate
  openssl_certificate:
    path: "/etc/etcd/{{ item }}.crt"
    csr_path: "/etc/etcd/{{ item }}.csr"
    ownca_path: "/etc/etcd/ca.crt"
    ownca_privatekey_path: "/etc/etcd/ca.key"
    ownca_not_after: "{{ next_year_date.stdout }}"
    provider: ownca
    force: true
  loop:
    - "etcd-server"
    - "apiserver-etcd-client"
    - "etcd-client"
    - "etcd-fixed-0"
