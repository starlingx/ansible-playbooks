#
# Probe: set probe_gen_secret_exists (bool). Checks the immutable generation
# secret produced by `baomon conversion` exists. Input: probe_gen_secret_name
# (required — discovered by the caller). Read-only.

- name: "Probe gen_secret_exists: query {{ probe_gen_secret_name }}"
  command: >-
    kubectl get secret {{ probe_gen_secret_name }}
    -n {{ openbao_namespace }}
    -o name
  environment: "{{ openrc_env }}"
  register: probe_gen_raw
  failed_when: false
  check_mode: false

- name: "Probe gen_secret_exists: set result fact"
  set_fact:
    probe_gen_secret_exists: "{{ (probe_gen_raw.rc | default(1)) == 0 }}"
