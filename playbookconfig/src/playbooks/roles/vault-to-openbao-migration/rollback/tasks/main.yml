#
# Ordered OpenBao teardown + Vault restore, dispatched from the playbook's rescue.
# rollback_mode: manual prints operator steps; auto runs auto_teardown.yml; off
# leaves state. Always available: the migration never modifies the original Vault PVCs/PVs.
- name: "rollback — announce dispatch"
  debug:
    msg: >-
      Rollback dispatched: rollback_mode={{ rollback_mode }},
      vault_final_state={{ vault_final_state }}, check_mode={{ ansible_check_mode }}.
  tags: [rollback]

# --- manual: HALT, print ordered operator steps, make NO changes ---
- name: "rollback (manual) — halt and print operator steps, make no changes"
  debug:
    msg: >-
      [ROLLBACK: manual] Halting; no changes made (source Vault data
      + cluster-key-* secrets intact). Re-run with -e rollback_mode=auto to tear
      down OpenBao and restore Vault, or see rollback/tasks/auto_teardown.yml for the ordered steps.
  when: rollback_mode == 'manual'
  tags: [rollback]

# --- auto: run the ordered teardown + Vault restore ---------------------------
- name: "rollback (auto) — run ordered teardown + Vault restore"
  include_tasks: "{{ role_path }}/tasks/auto_teardown.yml"
  when: rollback_mode == 'auto'
  tags: [rollback]

# --- off: leave state for inspection; perform no rollback ---------------------
- name: "rollback (off) — leave state for inspection, no rollback"
  debug:
    msg: >-
      [ROLLBACK: off] Leaving the current state for inspection; nothing changed.
      Choose: -e rollback_mode=auto (teardown + restore), rollback_mode=manual
      (ordered steps), or resume the migration (idempotent probes skip completed work).
  when: rollback_mode == 'off'
  tags: [rollback]
