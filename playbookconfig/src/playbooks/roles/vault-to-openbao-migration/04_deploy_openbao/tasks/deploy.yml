# Phase 4 — deploy OpenBao with the injector disabled and a single HA-raft
# replica. The StatefulSet binds the pre-created PVC holding the copied Raft
# store by its volumeClaimTemplate name.
- name: "Probe current OpenBao application state (skip-if-done)"
  include_tasks: "{{ role_path }}/../common/tasks/probes/app_state.yml"
  vars:
    probe_app_name: openbao
    probe_app_halt_on_unknown: true
    probe_app_halt_hint: >-
      Fix the platform CLI, then resume with '--tags phase4'.
- name: "Record OpenBao app state before deploy"
  set_fact:
    openbao_state_before: "{{ probe_app_state }}"
# Phase 1 runs the same find, but a standalone --tags phase4 run skips Phase 1.
- name: "Discover the staged OpenBao app tarball (glob)"
  find:
    paths: "{{ openbao_apps_dir }}"
    patterns: "{{ openbao_tarball_glob }}"
    file_type: file
  register: openbao_tarball_find
  check_mode: false
- name: "Assert exactly one OpenBao app tarball is staged"
  assert:
    that:
      - (openbao_tarball_find.files | default([]) | length) == 1
    fail_msg: >-
      Expected exactly one '{{ openbao_tarball_glob }}' under {{ openbao_apps_dir }},
      found {{ openbao_tarball_find.files | default([]) | length }}.
    quiet: true
# Phase 2 normally creates the output dir; a standalone --tags phase4 run skips it.
- name: "Write the migration override files"
  when: not ansible_check_mode
  block:
    - name: "Ensure the migration output dir exists"
      file:
        path: "{{ gather_output_dir }}"
        state: directory
        mode: "0700"
    # Once gen-001 exists a resumed run may have scaled out already (it re-enters here when
    # every pod was sealed at entry). Writing replicas=1 and a paused manager then would be
    # applied by the next Helm apply and undo the scale-out.
    - name: "Assert the target replica count is known for a re-entered deploy"
      assert:
        that: openbao_replicas | default('') is match('^[1-9][0-9]*$')
        fail_msg: >-
          gen-001 exists but the OpenBao replica count cannot be derived (missing
          {{ openbao_user_overrides_snapshot }} or unreadable system overrides). Nothing was changed.
        quiet: true
      when: gen_exists_at_entry | bool
    - name: "Write injector-disabled helm override values (replicas=1 until gen-001 exists)"
      copy:
        dest: "{{ gather_output_dir }}/openbao-deploy-overrides.yaml"
        mode: "0600"
        content: >-
          {{ openbao_migration_overrides
             | combine({'server': {'ha': {'replicas': (openbao_replicas | int)
                                          if (gen_exists_at_entry | bool) else 1}}}, recursive=true)
             | to_nice_yaml(indent=2) }}
    # pause: 2 parks the manager at init.sh trap 2, after the server pod is up and
    # before `exec baomon run`.
    - name: "Write the manager pause helm override (paused until gen-001 exists)"
      copy:
        dest: "{{ gather_output_dir }}/openbao-manager-pause-overrides.yaml"
        mode: "0600"
        content: |
          manager:
            pause: {{ '""' if (gen_exists_at_entry | bool) else 2 }}
- name: "Upload the OpenBao app and wait for it to reach 'uploaded'"
  when: openbao_state_before == 'absent'
  block:
    - name: "Ensure the OpenBao app is uploaded"
      command: system application-upload {{ (openbao_tarball_find.files | first).path }}
      environment: "{{ openrc_env }}"
    - name: "Wait for the OpenBao app to reach 'uploaded'"
      include_tasks: "{{ role_path }}/../common/tasks/wait_app_state.yml"
      vars:
        wait_app_name: openbao
        wait_app_accept: ['uploaded']
        wait_app_retries: 30
      when: not ansible_check_mode
# The scale-out rebuilds the chart's user overrides from this copy, so it is taken once, before
# the migration's first write. A resume keeps the first copy.
- name: "Save the openbao chart's user overrides before the migration writes any"
  when: not ansible_check_mode
  block:
    - name: "Check for a saved copy"
      stat:
        path: "{{ openbao_user_overrides_snapshot }}"
      register: user_overrides_saved
    - name: "Read the openbao chart's user overrides"
      command: python3 {{ role_path }}/../common/files/helm-overrides.py openbao openbao openbao user
      environment: "{{ openrc_env }}"
      register: user_overrides_now
      when: not user_overrides_saved.stat.exists
    - name: "Save them"
      copy:
        dest: "{{ openbao_user_overrides_snapshot }}"
        mode: "0600"
        content: "{{ user_overrides_now.stdout }}"
      when: not user_overrides_saved.stat.exists
- name: "Apply the OpenBao helm overrides (user first, migration base last)"
  command: >-
    system helm-override-update openbao {{ item.chart }} openbao
    --reuse-values --values {{ item.file }}
  environment: "{{ openrc_env }}"
  loop: >-
    {{
      [
        {'chart': 'openbao',
         'file': (openbao_user_overrides_file | default('') | string | trim)},
        {'chart': 'openbao',
         'file': (gather_output_dir ~ '/openbao-deploy-overrides.yaml')},
        {'chart': 'openbao-manager',
         'file': (openbao_manager_user_overrides_file | default('') | string | trim)},
        {'chart': 'openbao-manager',
         'file': (gather_output_dir ~ '/openbao-manager-pause-overrides.yaml')},
      ] | selectattr('file', '!=', '') | list
    }}
  loop_control:
    label: "{{ item.chart }}: {{ item.file | basename }}"
# 'already' is tolerated when the app is already applying.
- name: "Apply the OpenBao application (injector disabled, replicas=1)"
  command: system application-apply openbao
  environment: "{{ openrc_env }}"
  register: app_apply
  failed_when:
    - app_apply.rc != 0
    - "'already' not in (app_apply.stderr | default('') | lower)"
# The app can stay 'applying' while the server is sealed, so wait for the pod, not 'applied'.
- name: "Wait for the OpenBao StatefulSet pod to exist (HelmRelease reconciled)"
  command: >-
    kubectl get pod {{ openbao_pod }} -n {{ openbao_namespace }}
    -o jsonpath={.metadata.name}
  environment: "{{ openrc_env }}"
  register: pod_exists
  when: not ansible_check_mode
  retries: 48
  delay: 10
  until: (pod_exists.stdout | trim) == openbao_pod
