#
# Phase 2 — gather Vault source data (read-only): the source inventory and a Raft
# data checksum manifest, written as reference JSON for the Phase 5 check. Skipped
# wholesale when verification_level is 'none' (Phase 5's check is then a no-op too).
- name: "Gather Vault source data"
  tags: [phase2]
  check_mode: false
  when: verification_level != 'none'
  block:
    # TODO(duplex-ha-migration): simplex only; on duplex vault_pod should be the Raft leader.
    # In-pod reads need auth: load the root token from the shard set, pass it on stdin.
    - name: "Load Vault root token"
      include_tasks: "{{ role_path }}/../common/tasks/load_root_token.yml"
      vars:
        token_secret_namespace: "{{ vault_namespace }}"
        token_secret_name: "{{ s1_shard_secret_prefix | default(vault_shard_secret_prefix) }}-root"

    - name: "Bind the decoded token to the phase-local name"
      set_fact:
        s2_vault_token: "{{ root_token }}"
      no_log: true

    # Per-run key for the value hashes, held only in this Ansible run's memory
    # (lookup with /dev/null stores nothing). Phase 5 must run in the same
    # process to reuse it; see equivalence_check.yml.
    - name: "Generate the per-run value-hash key (memory only)"
      set_fact:
        vtom_hash_key: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
      no_log: true
      when: verification_level == 'values'

    - name: "Warn about the secret-content comparison scope"
      debug:
        msg: >-
          verification_level=values compares the contents of the KV v2 'secret/'
          mount only. Other KV mounts, and KV v1 mounts, are not compared by content.
      when: verification_level == 'values'

    # Collectors run as the `sh -c` script (no `kubectl cp`), so nothing is written
    # into Vault; the token stays on stdin, never in argv.
    - name: "Run source-inventory collector in-pod (vault CLI; token on stdin)"
      command:
        argv:
          - kubectl
          - exec
          - -i
          - "{{ vault_pod }}"
          - -n
          - "{{ vault_namespace }}"
          - --
          - sh
          - -c
          - "{{ lookup('file', role_path ~ '/../common/files/collect-inventory.sh') }}"
          - collect-inventory
          - vault
          - "{{ verification_level }}"
        stdin: "{{ s2_vault_token }}{{ ('\n' ~ vtom_hash_key) if verification_level == 'values' else '' }}"
      environment: "{{ openrc_env }}"
      register: s2_inventory_raw
      failed_when: false
      no_log: true

    # The collector's stderr carries only its own sanitized one-line reasons.
    - name: "Assert the source-inventory collector succeeded"
      assert:
        that: s2_inventory_raw.rc == 0
        fail_msg: >-
          The Vault inventory collector failed (rc={{ s2_inventory_raw.rc }}):
          {{ s2_inventory_raw.stderr_lines | default([]) | last | default('(no stderr)') }}
        quiet: true

    - name: "Parse the source inventory"
      set_fact:
        s2_inventory: "{{ (s2_inventory_raw.stdout | from_json)
          if (s2_inventory_raw.stdout | default('') | trim) != '' else {} }}"
      no_log: "{{ verification_level == 'values' }}"

    - name: "Run data-checksum collector on the Raft data dir in-pod"
      command:
        argv:
          - kubectl
          - exec
          - "{{ vault_pod }}"
          - -n
          - "{{ vault_namespace }}"
          - --
          - sh
          - -c
          - "{{ lookup('file', role_path ~ '/files/collect-data-checksums.sh') }}"
          - collect-data-checksums
          - "{{ vault_data_mount }}"
      environment: "{{ openrc_env }}"
      register: s2_data_checksums_raw

    - name: "Parse source data checksums"
      set_fact:
        s2_data_checksums: "{{ (s2_data_checksums_raw.stdout | from_json)
          if (s2_data_checksums_raw.stdout | default('') | trim) != '' else {} }}"

    - name: "Assert the checksum manifest captured the expected Raft files"
      assert:
        that:
          - (s2_data_checksums.file_count | default(0) | int) > 0
          - (s2_data_checksums.total_bytes | default(0) | int) > 0
          - "'node-id' in _paths"
          - "'vault.db' in _paths"
          - "'raft/raft.db' in _paths"
        fail_msg: >-
          The checksum manifest did not find the expected Raft files under
          {{ vault_data_mount }} on {{ vault_pod }}
          (file_count={{ s2_data_checksums.file_count | default(0) }}).
        quiet: true
      vars:
        _paths: "{{ s2_data_checksums.files | default([]) | map(attribute='path') | list }}"

    - name: "Assemble the source inventory reference"
      set_fact:
        s2_source_inventory:
          schema: vtom.source-inventory/v1
          verification_level: "{{ verification_level }}"
          system_mode: "{{ migration_system_mode }}"
          query_pod: "{{ vault_pod }}"
          engine_mounts: "{{ s2_inventory.engine_mounts | default([]) }}"
          auth_mounts: "{{ s2_inventory.auth_mounts | default([]) }}"
          audit_devices: "{{ s2_inventory.audit_devices | default([]) }}"
          policies: "{{ s2_inventory.policies | default([]) }}"
          secret_paths: "{{ s2_inventory.secret_paths | default([]) }}"
          value_hashes: "{{ s2_inventory.value_hashes | default([]) }}"
          data_checksums: "{{ s2_data_checksums | default({}) }}"
      no_log: "{{ verification_level == 'values' }}"

    - name: "Ensure inventory output dir exists (0700)"
      file:
        path: "{{ gather_output_dir }}"
        state: directory
        mode: "0700"

    - name: "Write source inventory JSON (0600)"
      copy:
        content: "{{ s2_source_inventory | to_nice_json }}"
        dest: "{{ gather_output_dir }}/source-inventory.json"
        mode: "0600"
      no_log: "{{ verification_level == 'values' }}"

    - name: "Write source data-checksum manifest JSON (0600)"
      copy:
        content: "{{ s2_data_checksums | default({}) | to_nice_json }}"
        dest: "{{ gather_output_dir }}/source-data-checksums.json"
        mode: "0600"

- name: "Note skipped source-data gathering"
  debug:
    msg: >-
      verification_level=none: skipping Phase 2 source-data gathering. No source
      inventory is recorded, so the Phase 5 equivalence check is also skipped and
      the migration runs without verification.
  tags: [phase2]
  when: verification_level == 'none'
