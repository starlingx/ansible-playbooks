#
# Phase 5, part 2 (tasks_from: finalize) — release stale clone PVs and confirm Vault's
# final state. Runs after the validation passed, outside the playbook's rescue block: a
# failure here stops the run and leaves OpenBao in place. Never modifies the original
# Vault PVCs/PVs.
- name: "Cleanup gate"
  import_tasks: gates.yml
  tags: [phase5]
- name: "Cleanup"
  import_tasks: cleanup.yml
  tags: [phase5]
- name: "Final Vault state confirmation"
  import_tasks: final_vault_state.yml
  tags: [phase5]
- name: "Remove gathered inventory files"
  include_tasks:
    file: "{{ role_path }}/../common/tasks/cleanup_gather_output.yml"
    apply:
      tags: [phase5]
  tags: [phase5]
