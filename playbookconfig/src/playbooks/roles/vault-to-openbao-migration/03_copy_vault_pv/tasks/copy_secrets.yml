# Phase 3 — copy the legacy unseal secrets (<prefix>-0..N-1 + root) vault ns ->
# openbao ns via files/copy-secrets.py, building each from name/type/.data. The
# data never passes through Ansible; a secret already present must match the source.
- name: "Copy the legacy unseal secrets"
  tags: [phase3]
  block:
    # Prefer the prefix Phase 1 recorded; fall back to the configurable
    # vault_shard_secret_prefix when it is unset.
    - name: "Derive the legacy secret names from the discovered shard prefix"
      set_fact:
        s3_legacy_secret_names: >-
          {{ range(vault_shard_secret_count | int) | map('string')
             | map('regex_replace', '^', p ~ '-') | list + [p ~ '-root'] }}
      vars:
        p: "{{ s1_shard_secret_prefix | default(vault_shard_secret_prefix) }}"

    # The secret data stays between kubectl and the script, never in Ansible, so
    # the task needs no no_log; its output is names and counts only.
    - name: "Copy the missing legacy secrets and verify all (copy-secrets.py)"
      command: "python3 {{ role_path }}/files/copy-secrets.py {{ s3_legacy_secret_names | join(' ') }}"
      environment: "{{ openrc_env }}"
      register: s3_secret_copy
      when: not ansible_check_mode
