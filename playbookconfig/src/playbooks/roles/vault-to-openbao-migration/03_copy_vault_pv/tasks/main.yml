    msg: >-
      Phase 3 copy (system_mode={{ migration_system_mode }},
      vault_final_state={{ vault_final_state }}).
      {{ 'DRY-RUN: no changes will be made.' if ansible_check_mode else '' }}

- name: "Shut Vault down"
  import_tasks: shutdown.yml
  tags: [phase3]
