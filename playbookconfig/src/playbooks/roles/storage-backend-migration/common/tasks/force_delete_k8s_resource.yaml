- name: >-
    Force delete k8s resource {{ kind | default('') }}
    {%- if k8s_namespace is defined %} in namespace {{ k8s_namespace }}
    {%- elif manifest_path is defined %} from {{ manifest_path }}
    {%- elif name is not defined %} --all{% endif %}
  shell: |
    {% set wait_delete = wait | default(true) %}

    kubectl delete \
    {% if k8s_namespace is defined %}
    -n {{ k8s_namespace }} \
    {% endif %}
    {% if manifest_path is defined %}
    -f {{ manifest_path }} \
    {% else %}
    {{ kind }} {{ name | default('--all') }} \
    {% endif %}
    --wait=false \
    --grace-period=0 \
    --force \
    --ignore-not-found=true

    {% if all is defined and all == true %}
      kubectl get \
      {% if k8s_namespace is defined %}
      -n {{ k8s_namespace }} \
      {% endif %}
      {{ kind }} -o name | \
      xargs -I % kubectl patch % \
      {% if k8s_namespace is defined %}
      -n {{ k8s_namespace }} \
      {% endif %}
      -p '{"metadata":{"finalizers":null}}' \
      --type=merge

      {% if wait_delete == true %}
        kubectl get \
        {% if k8s_namespace is defined %}
        -n {{ k8s_namespace }} \
        {% endif %}
        {{ kind }}
      {% endif %}

    {% else %}
      patch_err="$(kubectl patch \
      {% if k8s_namespace is defined %}
      -n {{ k8s_namespace }} \
      {% endif %}
      {% if manifest_path is defined %}
      -f {{ manifest_path }} \
      {% else %}
      {{ kind }} {{ name }} \
      {% endif %}
      -p '{"metadata": {"finalizers": null}}' \
      --type=merge 2>&1 1>/dev/null)" || {
        echo "$patch_err" | grep -q 'NotFound' || { echo "$patch_err" >&2; exit 1; }
      }

      {% if wait_delete == true %}
        ! kubectl get \
        {% if k8s_namespace is defined %}
        -n {{ k8s_namespace }} \
        {% endif %}
        {% if manifest_path is defined %}
        -f {{ manifest_path }}
        {% else %}
        {{ kind }} {{ name }}
        {% endif %}
      {% endif %}
    {% endif %}

  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: force_delete_result
  retries: 10
  delay: 3
  until: >
    (force_delete_result.rc == 0 and all is undefined )
    or
    ("No resources found" in force_delete_result.stderr and
     all is defined and
     all | bool)
    or
    not wait | default(true) | bool
