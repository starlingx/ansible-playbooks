- name: Restore CDI validating webhook configuration
  shell: |
    set -eo pipefail
    python3 -c '
    import sys, json

    resource = json.load(sys.stdin)
    meta = resource.get("metadata", {})
    for k in ["resourceVersion", "uid", "generation", "creationTimestamp", "managedFields", "selfLink"]:
        meta.pop(k, None)

    ann = meta.get("annotations", {})
    for k in ["kubectl.kubernetes.io/last-applied-configuration", "deployment.kubernetes.io/revision"]:
        ann.pop(k, None)

    resource.pop("status", None)
    json.dump(resource, sys.stdout)
    ' | kubectl apply --server-side --force-conflicts \
          --field-manager=storage-backend-migration -f -
  args:
    executable: /bin/bash
    stdin: "{{ cdi_webhook_backup_data | to_json }}"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"

- name: Scale up CDI deployment
  run_once: true
  include_tasks: "{{ roles_dir_path }}/common/tasks/kubernetes/scale_resources.yaml"
  vars:
    resources:
      - method: "name"
        name: "cdi-deployment"
        namespace: "{{ cdi_namespace }}"
        replicas: 1
        kind: Deployment

- name: Wait for CDI deployment pod to be ready
  run_once: true
  include_tasks: "{{ roles_dir_path }}/common/tasks/kubernetes/wait_resources_condition.yaml"
  vars:
    k8s_namespace: "{{ cdi_namespace }}"
    k8s_resource_prefix: "cdi-deployment"
    k8s_resource_type: "pod"
    wait_mode: "Ready"

