- name: Get current localhost real name
  ansible.builtin.add_host:
    name: "{{ lookup('ansible.builtin.pipe', 'hostname') }}"
    ansible_connection: "local"
  when: storage_backend is undefined

- name: Set current_storage_backend
  vars:
    real_host: "{{ lookup('ansible.builtin.pipe', 'hostname') }}"
  set_fact:
    current_storage_backend: "{{ hostvars[real_host]['storage_backend'] }}"
  changed_when: false
  when:
    - storage_backend is undefined
    - hostvars[real_host]['storage_backend'] is defined

- name: Get ceph storage_backend
  become: true
  become_user: postgres
  command: >
    psql -d sysinv -t -A -F '|' -c
    "
    SELECT JSON_BUILD_OBJECT(
      'id', id,
      'uuid', uuid
    )
    FROM storage_backend WHERE backend='ceph' AND name='ceph-store'
    "
  register: storage_backend_result
  changed_when: false
  when:
    - current_storage_backend is undefined
    - storage_backend is undefined

- name: Ensure storage_backend query returned data
  assert:
    that: storage_backend_result.stdout | trim | length > 0
    fail_msg: >-
      No 'ceph' storage_backend named 'ceph-store' was found in the inventory.
      Cannot continue the migration.
  when:
    - current_storage_backend is undefined
    - storage_backend is undefined

- name: Set storage_backend
  vars:
    real_host: "{{ lookup('ansible.builtin.pipe', 'hostname') }}"
  set_fact:
    storage_backend: "{{ current_storage_backend | default(storage_backend_result.stdout | from_json) }}"
    cacheable: true
  changed_when: false
  when: storage_backend is undefined

- name: Show storage_backend
  debug:
    var: storage_backend
