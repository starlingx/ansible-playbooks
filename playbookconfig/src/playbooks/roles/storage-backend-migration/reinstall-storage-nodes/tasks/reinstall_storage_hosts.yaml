- name: Reinstall storages
  environment: "{{ system_env }}"
  command: system host-reinstall {{ item }}
  loop: "{{ groups.storages }}"
  loop_control:
    label: "{{ item }}"
  register: reinstall_output

- name: Debug reinstall_output result
  debug:
    msg: "{{ item.stdout_lines | replace('\\n', '\n') }}"
  loop: "{{ reinstall_output.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Wait until all storage nodes are locked|disabled|offline
  become: true
  become_user: postgres
  command: >-
    psql -d sysinv -t -A -c
    "SELECT COUNT(*) FROM i_host
     WHERE hostname LIKE 'storage%'
       AND administrative = 'locked'
       AND operational = 'disabled'
       AND availability = 'offline';"
  register: storage_host_offline_count
  until: storage_host_offline_count.stdout | int == groups.storages | length
  retries: 180
  delay: 10
  changed_when: false

- name: Wait until all storage nodes are locked|disabled|online
  become: true
  become_user: postgres
  command: >-
    psql -d sysinv -t -A -c
    "SELECT COUNT(*) FROM i_host
     WHERE hostname LIKE 'storage%'
       AND administrative = 'locked'
       AND operational = 'disabled'
       AND availability = 'online';"
  register: storage_host_online_count
  until: storage_host_online_count.stdout | int == groups.storages | length
  retries: 360
  delay: 10
  changed_when: false

- name: Wait until all storage nodes done reinstalling
  become: true
  become_user: postgres
  command: >-
    psql -d sysinv -t -A -c
    "SELECT COUNT(*) FROM i_host
     WHERE hostname LIKE 'storage%'
       AND inv_state = 'inventoried'
       AND action_state = 'reinstalled';"
  register: storage_host_reinstalling_count
  until: storage_host_reinstalling_count.stdout | int == groups.storages | length
  retries: 120
  delay: 10
  changed_when: false

# After reinstall, the storage nodes regenerate their SSH host keys.
# The stale entries in the active controller's ~/.ssh/known_hosts become
# invalid, causing the next SSH connection to fail with
# "REMOTE HOST IDENTIFICATION HAS CHANGED". Remove the old entries
# so subsequent SSH connections succeed.
- name: Remove stale SSH known_hosts entries for reinstalled storage nodes
  become: true
  become_user: sysadmin
  command: ssh-keygen -f "/home/sysadmin/.ssh/known_hosts" -R "{{ item }}"
  loop: "{{ groups.storages }}"
  loop_control:
    label: "{{ item }}"
  register: known_hosts_cleanup
  failed_when:
    - known_hosts_cleanup.rc != 0
    - "'No such file or directory' not in known_hosts_cleanup.stderr"
    - "'not found in' not in known_hosts_cleanup.stderr"
  changed_when: known_hosts_cleanup.rc == 0
