- name: Validate rename_pvcs_list
  assert:
    that:
      - rename_pvcs_list is defined
      - rename_pvcs_list is sequence
      - rename_pvcs_list is not string
      - rename_pvcs_list | length > 0
    fail_msg: "rename_pvcs_list must be a non-empty list of {namespace, from, to}"

- name: "Ensure {{ tmp_workspace }} exist"
  file:
    path: "{{ tmp_workspace }}"
    state: directory

- name: Copy rename script to host
  copy:
    src: "{{ role_path }}/files/rename_pvcs.py"
    dest: "{{ tmp_workspace }}/rename_pvcs.py"
    mode: "0755"

- name: Rename PVCs
  command: "{{ tmp_workspace }}/rename_pvcs.py"
  args:
    stdin: |
      {% for item in rename_pvcs_list %}
      {{ item.namespace }} {{ item.from }} {{ item.to }}
      {% endfor %}
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  retries: 5
  delay: 60

- name: Cleanup temporary workspace folder
  file:
    path: "{{ tmp_workspace }}"
    state: absent
