- name: Add LVM storage backend
  command: system storage-backend-add lvm
  environment: "{{ system_env }}"
  register: storage_backend_add_result
  failed_when:
    - storage_backend_add_result.rc != 0
    - "'Only one lvm backend is allowed' not in (storage_backend_add_result.stderr | default(''))"
  changed_when: storage_backend_add_result.rc == 0

- name: Ensure /etc/platform/.node_lvm_csi_configured exists
  file:
    path: /etc/platform/.node_lvm_csi_configured
    state: touch
    modification_time: preserve
    access_time: preserve
    owner: root
    group: root
    mode: '0644'

# lvm_vg_name_cacheable is derived once at discovery (get-infos/lvm_disk_info.yaml).
- name: Display lvm_vg_name_cacheable
  debug:
    var: lvm_vg_name_cacheable

- name: "Configure {{ lvm_mode_cached }} provisioning for {{ lvm_vg_name_cacheable }}"
  include_tasks: "{{ lvm_mode_cached }}/main.yaml"

- name: Apply lvm-csi application
  command: system application-apply lvm-csi
  environment: "{{ system_env }}"
  register: app_apply_result
  failed_when:
    - app_apply_result.rc != 0
    - "'applying' not in (app_apply_result.stderr | default(''))"
    - "'is already in progress' not in (app_apply_result.stderr | default(''))"
