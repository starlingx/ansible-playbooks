- name: "Batch block import for namespace {{ generic_pvc_namespace }}"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  block:
    - name: Set batch pod name
      set_fact:
        batch_pod_name: "{{ batch_pod_label }}-{{ now(fmt='%s') }}"

    - name: Create block batch pod {{ batch_pod_name }} with {{ batch_pvcs | length }} PVCs
      template:
        src: "{{ role_path_common }}/templates/pod-migration-block-batch.yaml.j2"
        dest: "{{ tmp_workspace }}/pod-migration-import-block-batch.yaml"
        mode: "0644"
      vars:
        pod_app_label: "{{ batch_pod_label }}"
        pod_name: "{{ batch_pod_name }}"
        pod_namespace: "{{ generic_pvc_namespace }}"
        batch_pvc_list: "{{ batch_pvcs }}"
        backup_path: "{{ generic_backups_path }}"

    - name: Apply block batch pod {{ batch_pod_name }}
      command: "kubectl apply -f {{ tmp_workspace }}/pod-migration-import-block-batch.yaml"

    - name: Wait for block batch pod {{ batch_pod_name }} to be running
      command: >
        kubectl get pod {{ batch_pod_name }} -n {{ generic_pvc_namespace }}
        -o jsonpath='{.status.phase}'
      register: batch_pod_status
      until: "'Running' in batch_pod_status.stdout"
      retries: 60
      delay: 10
      changed_when: false

    - name: Import each block PVC in batch
      include_tasks: import_block_backup_single_pvc.yaml
      loop: "{{ batch_pvcs }}"
      loop_control:
        loop_var: pvc
        index_var: pvc_index

    - name: Cleanup block batch pod {{ batch_pod_name }}
      command: "kubectl delete -f {{ tmp_workspace }}/pod-migration-import-block-batch.yaml --ignore-not-found=true --wait=false"
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
