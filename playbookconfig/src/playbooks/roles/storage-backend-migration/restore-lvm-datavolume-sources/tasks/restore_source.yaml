- name: "Set DV facts for {{ dv_entry.key }}"
  set_fact:
    dv_name: "{{ dv_entry.key }}"
    dv_namespace: "{{ dv_entry.value.namespace }}"
    dv_source: "{{ dv_entry.value.source }}"
    dv_source_ref: "{{ dv_entry.value.sourceRef }}"

- name: "Restore source on {{ dv_name }}"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  block:
    - name: "Mark backing PVC as populated for {{ dv_name }}"
      command: >-
        kubectl annotate pvc {{ dv_name }}
        -n {{ dv_namespace }}
        cdi.kubevirt.io/storage.populatedFor={{ dv_name }}
        --overwrite
      when: dv_source is not none and (dv_source.pvc is defined or dv_source.snapshot is defined)

    - name: "Remove blank source from DataVolume {{ dv_name }}"
      command: >-
        kubectl patch datavolume {{ dv_name }}
        -n {{ dv_namespace }}
        --type merge
        -p '{"spec":{"source":null}}'

    - name: "Restore sourceRef on DataVolume {{ dv_name }}"
      command: >-
        kubectl patch datavolume {{ dv_name }}
        -n {{ dv_namespace }}
        --type merge
        -p '{"spec":{"sourceRef":{{ dv_source_ref | to_json }}}}'
      when: dv_source_ref is not none and dv_source_ref | length > 0

    - name: "Restore source on DataVolume {{ dv_name }}"
      command: >-
        kubectl patch datavolume {{ dv_name }}
        -n {{ dv_namespace }}
        --type merge
        -p '{"spec":{"source":{{ dv_source | to_json }}}}'
      when: dv_source is not none and dv_source | length > 0
