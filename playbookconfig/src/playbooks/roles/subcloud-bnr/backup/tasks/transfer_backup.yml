#
# TASKS DESCRIPTION:
#   Transfer subcloud backup files to the system controller. Restore the previous
#   backup if exists in case of transfer failure.
#
- name: Transfer subcloud backup files to the system controller
  block:
  - name: Create backup storage directory for {{ inventory_hostname }} on system controller
    file:
      path: "{{ central_backup_dir }}"
      state: directory
      mode: '0700'
      owner: root
      group: root
      recurse: yes
    connection: local

  - name: Get files in {{ backup_dir }} on {{ inventory_host_name }}
    find:
      paths: "{{ backup_dir }}"
      patterns: '*backup_*.tgz,*backup_*.tgz.gpg'
    register: backup_files

  - name: Filter backup files created by this run
    set_fact:
      backup_files_to_transfer: >-
        {{
          backup_files.files
          | rejectattr('path', 'in', existing_backup_file_paths)
          | sort(attribute='mtime')
          | map(attribute='path')
          | list
        }}
    vars:
      existing_backup_file_paths: "{{ existing_files_before_backup.files | map(attribute='path') | list }}"

  - name: Fail if there are no backup files to transfer
    fail:
      msg: "No backup files were found in {{ backup_dir }} to transfer to the system controller."
    when: backup_files_to_transfer | length == 0

  # This task only works without privilege escalation. Setting become to true
  # makes the rsync on the remote host to be run with sudo, and since it's not
  # possible to provide a password (limitation from rsync itself), the file transfer fails.
  # Since the whole restore playbook is being run by root, the central_backup_dir
  # can be accessed to save the file without setting become to true.
  - name: Transfer backup files of {{ inventory_hostname }} to the system controller
    synchronize:
      mode: pull
      src: "{{ item }}"
      dest: "{{ central_backup_dir }}/"
    register: backup_transfer
    until: backup_transfer.rc == 0
    retries: 3
    delay: 2
    become: false
    loop: "{{ backup_files_to_transfer }}"
    loop_control:
      label: "{{ item | basename }}"

  - name: Remove previous backup upon successful subcloud backup (central storage)
    file:
      path: "{{ previous_backup_dir }}"
      state: absent
    connection: local
    when: previous_backup_dir is defined

  rescue:
    - name: Remove empty/incomplete backup directory on the system controller
      file:
        path: "{{ central_backup_dir }}"
        state: absent
      connection: local

    - name: Restore previous backup upon failure
      command: mv {{ previous_backup_dir }} {{ central_backup_dir }}
      connection: local
      when: previous_backup_dir is defined

    - name: Set failure message for transfer task failure
      set_fact:
        failure_msg: >
          {{ failed_backup_transfer.msg | default(ansible_failed_result.msg | default('unknown')) }}.
          rc: {{ failed_backup_transfer.rc | default(ansible_failed_result.rc | default('unknown')) }}
      vars:
        failed_backup_transfer: >-
          {{
            (backup_transfer | default({})).results
            | default([])
            | selectattr('failed', 'defined')
            | selectattr('failed')
            | first
            | default({})
          }}

    - name: Force fail post rescue of transfer task failure
      fail:
        msg: >
          An error occurred while transferring backup file to the system controller.
          {{ failure_msg }}

  always:
    - name: Remove staging backup file/directory from {{ inventory_hostname }}
      file:
        path: "{{ item }}"
        state: absent
      loop: "{{ (backup_files_to_transfer | default([])) + [default_local_staging_dir] }}"
