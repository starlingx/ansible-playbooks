# ROLE DESCRIPTION:
#   This role is to apply the puppet manifest specific to optimized restore.

- name: Create hieradata workdir
  file:
    path: "{{ hieradata_workdir }}"
    state: directory

- name: Restore puppet hieradata to working directory
  command: >
    tar --use-compress-program=pigz -C {{ hieradata_workdir | quote }}
    -xpf {{ platform_backup_fqpn | quote }}
    --overwrite --transform='s,.*/,,'
    'opt/platform/puppet/{{ previous_software_version }}/hieradata'

- name: Check if the controller0_hieradata file exists
  stat:
    path: "{{ hieradata_workdir }}/controller-0.yaml"
  register: controller0_hieradata

- name: Fail if controller0_hieradata file does not exist
  fail:
    msg: >
      "{{ hieradata_workdir }}/controller-0.yaml not found.
      Optimized-restore cannot proceed without it."
  when: not controller0_hieradata.stat.exists

- name: Read in system.yaml network values
  shell: "grep -E '^platform::network::' {{ hieradata_workdir }}/system.yaml"
  register: system_result

- name: Include system values as facts
  set_fact:
    system_values: "{{ system_result.stdout | from_yaml }}"

- name: Set derived network parameters
  set_fact:
    derived_network_params:
      controller_0_address: "{{ system_values[c0_address_key] }}"
      controller_0_cluster_host: "{{ system_values[c0_cluster_host_key] }}"
  vars:
    c0_address_key: "platform::network::mgmt::params::controller0_address"
    c0_cluster_host_key: "platform::network::cluster_host::params::controller_address"

- name: Compare with backup LV sizes for db update during factory restore
  block:
    - name: Compare logical volume sizes
      script: compare_backup_lvs.py {{ postgres_staging_dir | quote }}
      register: lv_comparison_result

    - name: Set LV adjustment facts
      set_fact:
        lvs_to_update_after_db_restore: >-
          {{ (lv_comparison_result.stdout | from_json).lvs_to_update_after_db_restore }}

    - name: Display LV comparison results
      debug:
        msg: "LVs to update after db restore: {{ lvs_to_update_after_db_restore }}"
  when: factory_restore | default(false)

# Skip puppet manifest apply for factory restore.
# Factory system is already configured with running services.
- block:
  - name: Setup flags to control puppet manifest apply
    file:
      path: /etc/platform/simplex
      state: touch

  - name: Create puppet hieradata runtime configuration
    copy:
      dest: "{{ hieradata_workdir }}/runtime.yaml"
      content: |
        platform::network::mgmt::params::subnet_version: 4
        platform::network::mgmt::params::controller0_address: 127.0.0.1
        platform::network::mgmt::params::controller1_address: 127.0.0.2
      force: yes

  - name: Add original lv_sizes to runtime configuration
    shell: >
      grep -E '{{ pattern }}' '{{ controller0_hieradata.stat.path }}'
      | tee -a '{{ hieradata_workdir }}/runtime.yaml'
    vars:
      pattern: "::lv_size:\\s"
    when: controller0_hieradata.stat.isreg|default(false)

  - name: Add missing static values to hieradata during upgrade
    block:
      - name: Create hieradata upgrade workdir
        file:
          path: "{{ hieradata_upgrade_workdir }}"
          state: directory

      - name: Generating static config data for upgrade
        command: "/usr/bin/sysinv-puppet create-static-config {{ hieradata_upgrade_workdir }}"
        failed_when: false
        register: static_config_result

      - name: Fail if upgrade static hieradata cannot be generated
        fail:
          msg: "Failed to create upgrade puppet hiera static config."
        when: static_config_result.rc != 0

      - name: Prepare to merge static values
        set_fact:
          _kinds:
            static.yaml: { }
            secure_static.yaml: { }

      - name: Get content of static files
        ansible.builtin.slurp:
          src: "{{ item }}"
        register: _static_files
        loop:
          # Read upgrade static values first
          - "{{ hieradata_upgrade_workdir }}/static.yaml"
          - "{{ hieradata_upgrade_workdir }}/secure_static.yaml"
          # Then read original static values
          - "{{ hieradata_workdir }}/static.yaml"
          - "{{ hieradata_workdir }}/secure_static.yaml"
        no_log: true

      - name: Merge original static values with upgrade values
        set_fact:
          _kinds: >
            {{ _kinds | combine({item.item | basename: item.content | b64decode | from_yaml}, recursive=true) }}
        loop: "{{ _static_files.results }}"
        no_log: true

      - name: Update static values in hieradata directory
        copy:
          dest: "{{ hieradata_workdir }}/{{ item[0] }}"
          content: "{{ item[1] | to_nice_yaml }}"
          force: yes
        loop: "{{ _kinds.items() }}"
        no_log: true

    when:
      - upgrade_in_progress
      - previous_software_version is version('22.12', '>=')

  - name: Create SSL CA cert directory
    file:
      path: "{{  ca_cert_dir }}"
      state: directory
      owner: root
      group: root
      mode: 0755
      recurse: yes
    when: os_release == 'debian'

  - name: Migrate static hieradata to new version
    command: >
      sed -i
      '/{{ item }}/ s/{{ upgrade_metadata.from_release }}/{{ upgrade_metadata.to_release }}/g'
      {{ hieradata_workdir }}/static.yaml
    loop:
      - "platform::client::credentials::params::keyring_script_directory: "
      - "platform::client::credentials::params::keyring_script_file: "
      - "platform::params::software_version: "
    when: upgrade_in_progress|default(false)|bool


  # The restore manifest includes platform::etcd::bootstrap, which starts
  # etcd-fixed as the cluster seed. That service can only come up if two
  # prerequisites are already satisfied:
  #
  #   1. Its bind address is present on an interface. The unit file waits for
  #      the address parsed out of ETCD_LISTEN_PEER_URLS, and at this point in
  #      an optimized restore no platform interface has been configured yet.
  #   2. The etcd TLS material exists in /etc/etcd. The membership helper that
  #      runs as ExecStartPre needs ca.crt and the client certificate.
  #
  # Neither holds this early in the restore, so etcd-fixed fails and the whole
  # manifest returns non-zero. Satisfy both here. The certificates come out of
  # the backup rather than being regenerated, so the restored keyspace stays
  # verifiable by the same CA. See platform::etcd::bootstrap in stx-puppet.
  # The prefix follows the family: a host route is /32 on IPv4 and /128 on
  # IPv6. 'ip addr add <v6>/32' does not fail, it installs a /32 prefix on an
  # IPv6 address, so the wrong value is accepted silently rather than caught.
  - name: Add cluster-host addresses to loopback so etcd-fixed can bind
    command: ip addr add {{ item }}/{{ 128 if ':' in item else 32 }} dev lo
    loop: "{{ etcd_bind_addresses }}"
    register: _etcd_lo_add
    changed_when: _etcd_lo_add.rc == 0
    # Tolerate the address already being present. iproute2 words this
    # differently across versions ("Address already assigned",
    # "RTNETLINK answers: File exists"), so match either.
    failed_when:
      - _etcd_lo_add.rc != 0
      - not (_etcd_lo_add.stderr is search('(?i)already assigned|File exists'))
    vars:
      etcd_bind_addresses: "{{ [derived_network_params.controller_0_cluster_host,
                               system_values[c0_cluster_host_unit_key] | default('', true)]
                              | reject('equalto', '')
                              | reject('equalto', None)
                              | unique | list }}"
      c0_cluster_host_unit_key: "platform::network::cluster_host::params::controller0_address"

  - name: Restore etcd certificates from the backup before puppet starts etcd
    command: >-
      tar --use-compress-program=pigz -C /
      -xpf {{ platform_backup_fqpn | quote }}
      --overwrite etc/etcd

  - name: Check which etcd certificates were recovered
    find:
      paths: /etc/etcd
      patterns:
        - '*.crt'
        - '*.key'
    register: etcd_certs_found

  - name: Fail if the backup carried no etcd certificates
    fail:
      msg: >-
        No certificates were recovered into /etc/etcd from
        {{ platform_backup_fqpn }}. etcd-fixed cannot start without them, so the
        restore manifest would fail. Confirm the backup contains etc/etcd.
    when: etcd_certs_found.matched | int == 0

  # Older backups kept the apiserver etcd client pair only under
  # /etc/kubernetes/pki. Recover it from there when it is not already in place.
  - name: Recover the apiserver etcd client pair from the kubernetes pki
    command: >-
      tar --use-compress-program=pigz -C /etc/etcd
      -xpf {{ platform_backup_fqpn | quote }}
      --overwrite --strip-components 3
      {{ kubeadm_pki_dir | regex_replace('^/', '') }}/{{ item }}
    loop:
      - apiserver-etcd-client.crt
      - apiserver-etcd-client.key
    failed_when: false
    vars:
      kubeadm_pki_dir: /etc/kubernetes/pki
    when: >-
      etcd_certs_found.files
      | map(attribute='path')
      | select('search', 'apiserver-etcd-client')
      | list | length == 0

  # etcd-fixed is about to be started against an empty data directory. The
  # restored keyspace is loaded later by optimized-restore/restore-data, which
  # stops the service, replaces the database and restarts it. Any database left
  # behind from an earlier attempt would make this seed start refuse to come up
  # with initial-cluster-state=new, so clear it first.
  - name: Clear any stale etcd-fixed database before the seed start
    file:
      path: /opt/etcd-fixed/db
      state: "{{ item }}"
      mode: 0700
    loop:
      - absent
      - directory

  - name: Applying puppet restore manifest
    command: >-
      /usr/local/bin/puppet-manifest-apply.sh
      {{ hieradata_workdir }}
      controller-0
      controller
      restore
      {{ hieradata_workdir }}/runtime.yaml
    environment:
      INITIAL_CONFIG_PRIMARY: "true"
      LC_ALL: "en_US.UTF-8"
  when: not factory_restore

# TODO(outbrito): puppet sets permission to 750, not sure why...
- name: Set /opt/backups to 755 so postgres can read it
  file:
    path: "/opt/backups"
    state: directory
    mode: 0755

- block:
  # Stop and disable slapd here, it produces many errors in logs.
  # It will be re-enabled and started after unlocking is completed.
  - name: Disable slapd
    systemd:
      name: slapd
      state: stopped
      enabled: false

  - name: Persist hieradata during upgrades
    block:
      - name: Ensure Puppet directory exists
        file:
          path: "{{ upgrade_puppet_permdir }}"
          state: directory
          recurse: yes
          owner: root
          group: root
          mode: 0700

      - name: Persist puppet working files
        copy:
          src: "{{ (hieradata_workdir, item) | path_join }}"
          dest: "{{ upgrade_puppet_permdir }}"
          remote_src: true
          owner: root
          group: root
          mode: 0700
        loop: "{{ _kinds.keys() }}"

    always:
      - name: Cleanup temp directory
        file:
          path: "{{ hieradata_upgrade_workdir }}"
          state: absent

    vars:
      upgrade_puppet_permdir: >-
        {{
          (puppet_permdir.replace(software_version, previous_software_version), 'hieradata')
          | path_join
        }}

    when:
      - upgrade_in_progress
      - previous_software_version is version('22.12', '>=')

  when: not factory_restore
