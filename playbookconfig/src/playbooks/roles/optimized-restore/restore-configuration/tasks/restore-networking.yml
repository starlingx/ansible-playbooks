#
# SUB-TASKS DESCRIPTION:
#   Setup networking so that restoring can be completed.
#   Networking should match the state it would be in after
#   completing a typical bootstrapping, so that unlocking can
#   be performed immediately after optimized restore is complete.

# Interfaces brought up by ifupdown before the restore (for example the OAM
# interface configured at installation) stay recorded in /run/network/ifstate
# after their configuration files are removed below. If such an interface is
# a bond slave in the restored configuration, the ifenslave hook treats it as
# already up and does not enslave it when the bond comes up. The bond then
# starts without it while the interface still holds its addresses, so on IPv6
# the bond's address fails duplicate address detection and the network stays
# unreachable until unlock. Bring only those interfaces down, with their
# current configuration, so the bond can enslave them. Other interfaces are
# left up, so their connectivity is not interrupted. Limited to optimized
# restore of duplex and standard systems.
- name: Bring down interfaces that become bond slaves
  shell: |
    set -o pipefail
    up=$(/sbin/ifquery --state | cut -d= -f1 | grep -vx lo || true)
    [ -z "$up" ] && exit 0
    slaves=$(tar --use-compress-program=pigz -xOf {{ platform_backup_fqpn | quote }} \
               --wildcards '{{ network_scripts.lstrip('/') }}/ifcfg-*' \
             | awk '$1 == "iface" {i = $2} $1 == "bond-master" {print i}' | sort -u)
    down=""
    for i in $up; do
      echo "$slaves" | grep -qx -- "$i" && down="$down $i"
    done
    [ -z "$down" ] && exit 0
    echo "Bringing down:$down"
    /sbin/ifdown --force $down
  args:
    executable: /bin/bash
  register: ifdown_result
  changed_when: "'Bringing down' in ifdown_result.stdout"
  failed_when: false
  when:
    - system_mode != 'simplex'
    - restore_mode | default('old') == 'optimized'

- name: Remove network configuration files
  file:
    path: "{{ network_scripts }}"
    state: absent

- block:
    - name: Restore network configuration files from Debian
      command: >-
        tar --use-compress-program=pigz -C / --overwrite
        -xpf {{ platform_backup_fqpn | quote }} {{ network_scripts.lstrip('/') | quote }}

    - name: Validate OAM IP is not assigned to a wrong interface
      script: roles/optimized-restore/restore-configuration/files/validate_oam_interface.py {{ network_scripts }}
      args:
        executable: /usr/bin/python3
      register: oam_validation_result
      failed_when: false

    - name: Set OAM validation failed flag
      set_fact:
        oam_validation_failed: "{{ oam_validation_result.stdout is defined and
                                   oam_validation_result.stdout.strip() == 'False' }}"

    - name: Warn if OAM IP address is on a wrong interface
      debug:
        msg: >-
          WARNING: OAM interface validation detected a potential conflict.
          Details: {{ oam_validation_result.stderr | default('') }}
      when: oam_validation_failed | bool

    - name: Bring up original networking
      shell:
        cmd: |
          ifup $(ls ifcfg-* | sed 's/ifcfg-//') --ignore-errors --force
        chdir: /etc/network/interfaces.d/
      async: 240
      poll: 5

  when: previous_software_version != '21.12'

- name: Bring up temporary addresses
  block:
    # This will create a list of currently available internal IP addresses on the system
    - name: Read current IP addresses
      shell: ip addr | awk '$1 ~ "inet" {print $2}' | cut -d'/' -f1
      register: all_addr_result

    # System values contains the puppet hieradata values for networking addresses.
    # Here we get the respective address from hieradata and add it if it's missing from
    # our list of already available internal addresses.
    - name: Add missing controller IP addresses
      command: "ip addr add {{ system_values[item] }} dev lo scope host"
      when:
        - system_values[item] not in all_addr_result.stdout_lines
        - not (system_mode == 'simplex' and item == 'platform::network::pxeboot::params::controller0_address')
      loop: "{{ network_address_keys }}"

- name: Start dnsmasq for internal FQDN
  command: dnsmasq
  become: yes
  when: not (factory_restore | default(false))

- name: Restart dnsmasq for internal FQDN during factory restore
  command: sm-restart-safe service dnsmasq
  become: yes
  when: factory_restore | default(false)
